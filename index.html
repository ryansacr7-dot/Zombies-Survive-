<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14110f">
<title>Zombies Survive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--panel:#2a2019;--panel2:#3a2c21;--line:#5a4433;--txt:#fff4e2;--dim:#c4ab92;--acc:#ffb535;--acc2:#ff8a1f;--red:#ef4b3a;--green:#6fd16a;--R:#4fa3ff;--SR:#c27bff;--SSR:#ffcf3a;
  --font:'Lilita One',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none;letter-spacing:.3px}
button{font-family:inherit;color:inherit;touch-action:manipulation;letter-spacing:.3px}
#app{position:relative;height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column}
#wrap{position:absolute;inset:0;overflow:hidden}
canvas#cv{display:block;touch-action:none;width:100%;height:100%}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 0;z-index:5;pointer-events:none}
#hud *{pointer-events:auto}
#resRow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.res.bad{color:#ff8a7a;animation:pulse 1s infinite}
.res.tap{cursor:pointer}
.res{display:flex;align-items:center;gap:3px;background:linear-gradient(#3a2c21,#241a14);border:2px solid #120d0a;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 0 #000;border-radius:20px;padding:2px 8px 2px 4px;font-size:14px;white-space:nowrap;text-shadow:0 1px 0 #000}
.res i{font-style:normal;font-size:15px}
.res.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25);color:var(--acc)}}
#resRow .sp{flex:1}
.ib{position:relative;width:36px;height:34px;border-radius:12px;border:2px solid #120d0a;background:linear-gradient(#4a382a,#2a2019);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 #000;font-size:16px;cursor:pointer}
.ib.on{background:linear-gradient(#ffcf5a,#e8921a);}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;min-width:17px;text-align:center;line-height:17px;border:2px solid #120d0a}
.dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #120d0a}
#subRow{display:flex;gap:6px;margin-top:6px;align-items:stretch}
#dayPill{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:74px;border-radius:12px;background:linear-gradient(#ffd77a,#e89a2a);color:#3a2408;border:2px solid #120d0a;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #000;font-size:15px;line-height:1;padding:4px 6px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
#dayPill small{font-size:10px;opacity:.8;margin-top:2px}
#dayPill.night{background:linear-gradient(#7d8cff,#3c3fa8);color:#fff;text-shadow:0 1px 0 #000}
#quest{flex:1;min-width:0;border-radius:12px;border:2px solid #120d0a;background:linear-gradient(#3a2c21,#241a14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 0 #000;padding:4px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
#quest .qi{font-size:22px}
#quest .qt{flex:1;min-width:0}
#quest .qt b{display:block;font-size:10px;color:var(--acc);font-weight:normal;letter-spacing:1px}
#quest .qt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;text-shadow:0 1px 0 #000}
#quest .qb{height:6px;background:#0c0806;border-radius:3px;margin-top:2px;overflow:hidden}
#quest .qb i{display:block;height:100%;background:linear-gradient(90deg,#ffcf5a,#ff8a1f);border-radius:3px;transition:width .3s}
#quest .qr{font-size:11px;color:var(--dim);white-space:nowrap;text-align:right}
#quest.done{background:linear-gradient(#ffd96a,#e8921a);color:#3a2408;animation:qglow 1s ease-in-out infinite}
#quest.done .qt span,#quest.done .qr{color:#3a2408;text-shadow:none}#quest.done .qt b{color:#6a3a00}
@keyframes qglow{50%{box-shadow:0 0 18px rgba(255,200,60,.9),0 2px 0 #000;transform:scale(1.02)}}
#notes{position:absolute;top:calc(env(safe-area-inset-top) + 140px);left:8px;right:8px;display:flex;flex-direction:column;gap:5px;z-index:6;pointer-events:none;align-items:center}
.nt{display:flex;align-items:center;gap:8px;background:rgba(30,22,17,.96);border:2px solid #120d0a;border-left:5px solid var(--acc);border-radius:12px;padding:6px 12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:nin .3s ease;max-width:100%;transition:opacity .3s,transform .3s;text-shadow:0 1px 0 #000}
.nt.bad{border-left-color:var(--red)}.nt.good{border-left-color:var(--green)}.nt.warn{border-left-color:#ffd23a}.nt.epic{border-left-color:var(--SSR);background:linear-gradient(90deg,#5a4210,#241a12)}
.nt i{font-style:normal;font-size:18px}
.nt.out{opacity:0;transform:translateY(-10px)}
@keyframes nin{from{opacity:0;transform:translateY(-14px) scale(.95)}}
#banner{position:absolute;top:36%;left:0;right:0;text-align:center;font-size:40px;pointer-events:none;opacity:0;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8);z-index:7;-webkit-text-stroke:2px #000}
#banner.go{animation:ban 2.2s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.8)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
#toast{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 150px);left:50%;transform:translateX(-50%) translateY(6px);background:rgba(20,15,12,.94);border:2px solid var(--acc);padding:7px 14px;border-radius:12px;font-size:14px;pointer-events:none;opacity:0;transition:all .25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:8;text-shadow:0 1px 0 #000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* bottom */
#bot{position:absolute;left:0;right:0;bottom:0;padding:0 8px calc(env(safe-area-inset-bottom) + 8px);z-index:5;pointer-events:none}
#bot *{pointer-events:auto}
#squad{display:flex;gap:7px;margin-bottom:7px;align-items:flex-end}
.port{position:relative;width:58px;height:58px;flex:0 0 58px;border-radius:14px;cursor:pointer;border:3px solid var(--R);background:#1c2733;box-shadow:0 3px 0 #000;overflow:hidden}
.port img{width:100%;height:100%;display:block}
.port.SR{border-color:var(--SR)}.port.SSR{border-color:var(--SSR)}
.port.ready{animation:rdy .8s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:0 0 16px 3px rgba(255,220,90,.9),0 3px 0 #000;transform:translateY(-3px)}}
.port.sel{outline:3px solid #fff;outline-offset:2px}
.port.down{filter:grayscale(1) brightness(.45)}
.port .hp{position:absolute;left:4px;right:4px;bottom:4px;height:5px;background:rgba(0,0,0,.7);border-radius:3px}
.port .hp i{display:block;height:100%;background:var(--green);border-radius:3px}
.port .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
.port .rdy{position:absolute;top:2px;right:3px;font-size:12px;text-shadow:0 1px 2px #000}
.port .lv{position:absolute;top:2px;left:4px;font-size:11px;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot{width:58px;height:58px;flex:0 0 58px;border-radius:14px;border:3px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:24px;cursor:pointer;background:rgba(0,0,0,.25)}
#auto{margin-left:auto;align-self:center;font-size:12px;padding:6px 10px;border-radius:10px;border:2px solid #120d0a;background:linear-gradient(#4a382a,#2a2019);box-shadow:0 2px 0 #000;cursor:pointer}
#auto.on{background:linear-gradient(#7be07a,#3a9a3a);color:#0d2a0d}
#btnRow{display:flex;gap:7px}
.mbtn{position:relative;flex:0 0 64px;height:58px;border-radius:14px;border:2px solid #120d0a;background:linear-gradient(#5a4433,#2e231a);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 #000;font-size:24px;cursor:pointer;line-height:1}
.mbtn small{display:block;font-size:11px;margin-top:3px;color:var(--dim)}
.mbtn:active,.big:active,#nightBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.mbtn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 18px rgba(255,190,60,.8),0 4px 0 #000}}
#nightBtn{flex:1;height:58px;border-radius:14px;border:2px solid #120d0a;background:linear-gradient(#ff7a4a,#c8301c);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 #000;font-size:20px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.4);line-height:1.05}
#nightBtn small{display:block;font-size:12px;opacity:.9}
#nightBtn.night{background:linear-gradient(#4a4fa8,#262a6a)}
#nightBtn .pb{height:6px;background:rgba(0,0,0,.4);border-radius:3px;margin:4px 14px 0;overflow:hidden}
#nightBtn .pb i{display:block;height:100%;background:#9fb4ff}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;transform:translateY(105%);transition:transform .25s ease;padding:0 8px calc(env(safe-area-inset-bottom) + 8px)}
#sheet.show{transform:none}
.sh{background:linear-gradient(#3a2c21,#241a14);border:2px solid #120d0a;border-radius:18px 18px 14px 14px;box-shadow:0 -6px 24px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.12);padding:10px 12px 12px}
.shh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.shh img{width:54px;height:54px}
.shh .tt{flex:1;min-width:0}
.shh .tt b{font-size:19px;font-weight:normal;display:block;text-shadow:0 2px 0 #000}
.shh .tt span{font-size:12px;color:var(--dim);display:block;font-family:system-ui,sans-serif}
.x{width:34px;height:34px;border-radius:10px;border:2px solid #120d0a;background:#2a2019;font-size:16px;cursor:pointer}
.opts{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.opt{flex:0 0 96px;border-radius:14px;border:2px solid #120d0a;background:linear-gradient(#5a4433,#2e231a);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 3px 0 #000;padding:6px 4px;text-align:center;cursor:pointer}
.opt img{width:58px;height:58px;display:block;margin:0 auto}
.opt b{font-weight:normal;display:block;font-size:13px}
.opt span{display:block;font-size:11px;color:var(--dim)}
.opt.no{opacity:.45}.opt.lock{opacity:.35;filter:grayscale(1)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;border-radius:12px;border:2px solid #120d0a;background:linear-gradient(#ffcf5a,#e8921a);color:#3a2408;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 #000;padding:9px 10px;font-size:15px;cursor:pointer}
.btn small{display:block;font-size:11px;opacity:.85}
.btn.blue{background:linear-gradient(#7fc4ff,#2f78d8);color:#fff;text-shadow:0 1px 0 #000}
.btn.green{background:linear-gradient(#8fe86a,#3a9a2a);color:#0d2a0d}
.btn.gray{background:linear-gradient(#6a5646,#3a2c21);color:var(--txt)}
.btn.red{background:linear-gradient(#ff7a6a,#c02a1a);color:#fff;text-shadow:0 1px 0 #000}
.btn:disabled{filter:grayscale(.8);opacity:.5}
.stline{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--dim);margin:2px 0 10px;line-height:1.5}
.stline b{color:var(--txt)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(8,6,5,.86);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov.hide{display:none}
.card{max-width:390px;width:100%;text-align:center}
.card h1{font-size:44px;line-height:1;margin-bottom:6px;font-weight:normal;text-shadow:0 4px 0 #000;-webkit-text-stroke:1.5px #000;color:#ffd96a}
.card h2{font-size:16px;color:#ff8a5a;margin-bottom:14px;letter-spacing:2px;font-weight:normal}
.card p{color:var(--dim);font-size:14px;line-height:1.5;margin-bottom:7px;font-family:system-ui,sans-serif}
.big{margin-top:12px;border-radius:16px;border:3px solid #120d0a;background:linear-gradient(#ffd96a,#f08a1a);color:#3a2408;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 #000;padding:13px 34px;font-size:22px;cursor:pointer}
.big.alt{background:linear-gradient(#6a5646,#3a2c21);color:var(--txt);font-size:16px;padding:10px 22px}
.big:disabled{filter:grayscale(.8);opacity:.5}
#startArt{width:100%;max-width:300px;aspect-ratio:1.4;margin:0 auto 6px;display:block}
.modal{background:linear-gradient(#3a2c21,#241a14);border:2px solid #120d0a;border-radius:18px;width:100%;max-width:450px;max-height:90%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.12)}
.mh{display:flex;align-items:center;padding:12px 14px;gap:8px;background:rgba(0,0,0,.2)}
.mh h3{font-size:21px;flex:1;font-weight:normal;text-shadow:0 2px 0 #000}
.mb{padding:12px 14px 14px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.hc{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;border:3px solid var(--R);background:#1c2733;box-shadow:0 3px 0 #000}
.hc img{width:100%;display:block}
.hc.SR{border-color:var(--SR)}.hc.SSR{border-color:var(--SSR)}
.hc .nm{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;padding:10px 2px 3px;text-align:center;text-shadow:0 1px 0 #000}
.hc .rt{position:absolute;top:2px;left:5px;font-size:11px;text-shadow:0 1px 2px #000}
.hc .lv{position:absolute;top:2px;right:5px;font-size:11px;text-shadow:0 1px 2px #000}
.hc .dp{position:absolute;top:20px;right:4px;font-size:12px}
.hc .st{color:var(--SSR);font-size:10px;letter-spacing:-1px;display:block}
.hc.un img{filter:brightness(0) opacity(.6)}
.det{text-align:center}
.det img{width:130px;border-radius:20px;border:3px solid var(--R);box-shadow:0 4px 0 #000}
.det img.SR{border-color:var(--SR)}.det img.SSR{border-color:var(--SSR);box-shadow:0 0 24px rgba(255,207,58,.6),0 4px 0 #000}
.det .row{display:flex;justify-content:space-around;margin:10px 0;font-size:14px}
.det .row div b{display:block;font-size:20px;font-weight:normal}
.det .sk{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;text-align:left;font-size:13px;margin-top:8px;color:var(--dim);font-family:system-ui,sans-serif}
.det .sk b{color:var(--txt);font-family:var(--font);font-weight:normal;font-size:15px}
.stars{color:var(--SSR);font-size:16px;letter-spacing:-1px}
.xpb{height:8px;background:#0c0806;border-radius:4px;margin:6px 40px 0;overflow:hidden}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#ffcf5a,#ff8a1f)}
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.pulls.one{grid-template-columns:130px;justify-content:center}
.pc{aspect-ratio:3/4.2;perspective:600px}
.pc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);animation:flip .55s ease forwards}
@keyframes flip{to{transform:rotateY(0)}}
.pc .fa,.pc .ba{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;border:3px solid var(--R);background:#1c2733}
.pc .fa img{width:100%;display:block}
.pc .fa.SR{border-color:var(--SR)}
.pc .fa.SSR{border-color:var(--SSR);box-shadow:0 0 18px rgba(255,207,58,.9)}
.pc .fa .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);font-size:10px;padding:2px 0;text-align:center}
.pc .fa .tag{position:absolute;top:2px;right:3px;font-size:10px;text-shadow:0 1px 2px #000}
.pc .fa .tag.new{color:var(--green)}
.pc .fa .rr{position:absolute;top:2px;left:4px;font-size:10px;text-shadow:0 1px 2px #000}
.pc .ba{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#5a3a14 0 7px,#3a250c 7px 14px);border-color:var(--acc)}
.rates{font-size:11px;color:var(--dim);margin-top:4px;font-family:system-ui,sans-serif}
.ev p{color:var(--dim);font-size:14px;margin:4px 0 14px;line-height:1.5;font-family:system-ui,sans-serif}
.ev .col{display:flex;flex-direction:column;gap:8px}
.nl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.nl i{font-style:normal;font-size:18px}.nl span{flex:1}.nl small{color:var(--dim);font-size:11px}
.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}
.daily div{background:rgba(0,0,0,.25);border:2px solid #120d0a;border-radius:10px;padding:6px 0;font-size:11px;color:var(--dim)}
.daily div b{display:block;font-size:18px;font-weight:normal}
.daily div.got{opacity:.4}.daily div.now{border-color:var(--SSR);color:var(--txt);animation:qglow 1.2s infinite}
.rw{display:flex;justify-content:center;gap:14px;font-size:24px;margin:12px 0}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}
.mrow .btn{flex:0 0 auto;min-width:80px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.stat div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px;font-size:12px;color:var(--dim);text-align:center}
.stat div b{display:block;font-size:22px;color:var(--txt);font-weight:normal}
/* dialog + hand */
#talk{position:fixed;inset:0;z-index:12;display:none;cursor:pointer;flex-direction:column;justify-content:flex-end;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.82));padding:0 10px calc(env(safe-area-inset-bottom) + 18px)}
#talk.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
#talk::before,#talk::after{content:'';position:fixed;left:0;right:0;height:7vh;background:#000;z-index:-1;transition:transform .4s}
#talk::before{top:0}#talk::after{bottom:0}
#talk .row{display:flex;align-items:flex-end;gap:8px;max-width:620px;width:100%;margin:0 auto}
#talk .row.right{flex-direction:row-reverse}
#talk .av{width:110px;height:110px;flex:0 0 110px;border-radius:20px;border:4px solid var(--acc);box-shadow:0 4px 0 #000;background:#1c2733;overflow:hidden;animation:avIn .35s ease}
#talk .av.SR{border-color:var(--SR)}#talk .av.SSR{border-color:var(--SSR)}#talk .av.echo{border-color:#4fa3ff;animation:avIn .35s ease,static .15s steps(2) infinite}
@keyframes avIn{from{transform:translateY(20px) scale(.9);opacity:0}}
@keyframes static{50%{filter:contrast(1.4) brightness(1.2)}}
#talk .av img{width:100%;display:block}
#talk .bub{flex:1;background:#fff4e2;color:#2a1a0c;border:3px solid #120d0a;border-radius:18px;padding:12px 14px 22px;box-shadow:0 5px 0 #000;font-size:17px;line-height:1.38;position:relative;min-height:96px}
#talk .bub b{display:block;color:#c8301c;font-weight:normal;font-size:15px;margin-bottom:2px}
#talk .bub small{position:absolute;right:12px;bottom:5px;font-size:12px;color:#8a6a4a;animation:pulse 1s infinite}
#talk .chap{text-align:center;margin-bottom:auto;margin-top:24vh;font-size:16px;animation:avIn .6s ease;color:var(--acc);letter-spacing:3px;text-shadow:0 2px 0 #000}
#talk .chap b{display:block;font-size:42px;color:#fff;font-weight:normal;letter-spacing:1px;-webkit-text-stroke:1px #000}
#talkSkip{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:13;border-radius:10px;border:2px solid #120d0a;background:rgba(40,30,22,.9);padding:6px 12px;font-size:14px;cursor:pointer;display:none}
.sv{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.sv img{width:44px;height:44px;border-radius:10px;border:2px solid #120d0a}
.sv .nm{flex:1;min-width:0;font-size:15px}.sv .nm small{display:block;font-size:11px;color:var(--dim);font-family:system-ui,sans-serif}

const ncd={};
function notify(icon,text,type,key,cool){
  if(key){const now=performance.now();if(ncd[key]&&now-ncd[key]<(cool||10000))return;ncd[key]=now;}
  if(G){G.notes.unshift({icon,text,type:type||'',at:Date.now()});if(G.notes.length>40)G.notes.length=40;G.unread++;}
  const box=$('notes');const el=document.createElement('div');el.className='nt '+(type||'');el.innerHTML='<i>'+icon+'</i><span>'+text+'</span>';
  box.appendChild(el);while(box.children.length>2)box.removeChild(box.firstChild);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},3400);
  if(type==='bad'||type==='warn')buzz('light');
}
function LN(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;}
const PIDS=[101,102,103,104,105,106];
function cancelPush(){const L=LN();if(!L)return;try{L.cancel({notifications:PIDS.map(id=>({id}))}).catch(()=>{});}catch(e){}}

function schedulePush(){
  const L=LN();if(!L||!G||G.tut||!SET.push)return;
  try{
    L.cancel({notifications:PIDS.map(id=>({id}))}).catch(()=>{});
    const now=Date.now(),list=[],full=fullInSecs(),at=ms=>({at:new Date(now+ms)});
    if(full>120)list.push({id:101,title:'📦 Your storage is full!',body:'Your farms and camps are overflowing. Collect before it goes to waste!',schedule:at(full*1000)});
    list.push({id:102,title:'⚡ Your scouts are rested',body:'Stamina is full. Unexplored tiles are waiting, Commander!',schedule:at(20*60e3)});
    list.push({id:103,title:'🧟 The horde is gathering...',body:'Night '+G.day+' is coming. Your survivors need their leader!',schedule:at(4*3600e3)});
    const t=new Date();t.setDate(t.getDate()+(G.lastDaily===todayStr()?1:0));t.setHours(10,0,0,0);if(t.getTime()<now+60e3)t.setDate(t.getDate()+1);
    list.push({id:104,title:'🎁 Daily supply drop!',body:'Your daily reward is ready. Keep your streak going!',schedule:{at:t}});
    list.push({id:105,title:'🍖 Your survivors are hungry',body:'Your survivors are waiting for food. Don\'t let them leave the camp!',schedule:at(20*3600e3)});
    list.push({id:106,title:'🔥 Ada: "Commander, where are you?"',body:'The camp is holding on, but not for long. Come back and lead us!',schedule:at(3*86400e3)});
    L.schedule({notifications:list}).catch(()=>{});
  }catch(e){}
}

  hunger:85,health:100,morale:70,job:-1,x:C+.5+(Math.random()-.5),y:C+1.2,tx:C+.5,ty:C+1.2,ph:0,wait:0};}
function addSurv(n,quiet){for(let i=0;i<n;i++){const v=newSurvivor();G.survs.push(v);if(!quiet&&G.tiles)float(C+.5,C+.3,'+1 🧍 '+v.n,'#6fd16a',true);}G.surv=G.survs.length;if(G.tiles)autoAssign();}
function eff(v){if(!v)return 0;let e=.3+v.morale/100*.8;if(v.hunger<25)e-=.3;if(v.health<40)e-=.25;return clamp(e,.3,1.3);}

function powerSupply(){let s=6;for(const t of G.blds||[])if(t.b&&t.b.type==='gen'){const w=workerOf(t);s+=Math.round((10+8*((t.b.lvl||1)-1))*(w?Math.min(1,eff(w)+.3):.3));}if(G.weather==='cold')s*=.75;return Math.round(s);}
function powerDemand(){let d=0;for(const t of G.blds||[])if(t.b)d+=(PUSE[t.b.type]||0)*(1+.25*((t.b.lvl||1)-1));return Math.round(d);}

function countType(k){let n=0;for(const t of G.tiles)if(t.b&&t.b.type===k)n++;return n;}
function afford(c){for(const k in c)if(G[k]<c[k])return false;return true;}

function give(r,from){for(const k in r)G[k]+=r[k];popRes(r);if(from)for(const k in r)if(r[k]>0)flyRes(from[0],from[1],k,Math.min(8,2+Math.floor(r[k]/6)));}

function upCost(t){const b=t.b,c=B[b.type].cost,m=Math.pow(1.9,b.lvl||1),o={};for(const k in c)o[k]=Math.ceil(c[k]*m);if(!o.scrap&&b.lvl>=2)o.scrap=5*b.lvl;return o;}

function curQuest(){
  if(G.quest<QUESTS.length)return QUESTS[G.quest];
  const i=G.quest-QUESTS.length,k=['night','kill','pull'][i%3],step=Math.floor(i/3)+1;
  if(k==='night')return {d:'Survive '+(10+step*3)+' nights',k,n:10+step*3,r:{tokens:4},ic:'🌅'};
  if(k==='kill')return {d:'Kill '+(300+step*200)+' zombies',k,n:300+step*200,r:{scrap:60,tokens:2},ic:'🧟'};
  return {d:'Recruit '+(20+step*10)+' times',k,n:20+step*10,r:{tokens:3},ic:'📻'};
}
function qProg(q){
  switch(q.k){case 'hq':return hqLvl();case 'squad':return G.squad.length;case 'collect_h':return Object.keys(G.owned).length;
    case 'herolvl':return Math.max(...Object.values(G.owned).map(o=>o.lvl));default:return G.stats[q.k]||0;}
}
function chapter(){return Math.min(CHAPTERS.length-1,Math.floor(G.quest/8));}
function refreshQuest(){
  if(G&&G.tut)return;
  const q=curQuest(),p=Math.min(q.n,qProg(q)),done=p>=q.n;
  $('qCh').textContent='CHAPTER '+(chapter()+1)+' · '+CHAPTERS[chapter()].toUpperCase();
  $('qI').textContent=done?'🎁':q.ic||'📜';
  $('qD').textContent=done?'Tap to claim!':q.d;
  $('qF').style.width=(p/q.n*100)+'%';
  $('qR').innerHTML=done?costStr(q.r):p+'/'+q.n+'<br>'+costStr(q.r);
  $('quest').classList.toggle('done',done);

function heroOn(t){return G.units.some(u=>!u.down&&Math.floor(u.px)===t.x&&Math.floor(u.py)===t.y);}
function nearestTile(pred,allowHero){let best=null,bd=1e9;for(const t of G.tiles){if(!pred(t)||(!allowHero&&!t.fog&&!t.b&&heroOn(t)))continue;const d=dist(t.x,t.y,C,C);if(d<bd){bd=d;best=t;}}return best;}
function hintTarget(){
  if(!G||G.paused||G.quest>=12)return null;

  if(G.sel)return {tile:nearestTile(t=>!canPlace(G.sel,t))};

  switch(q.hint){
    case 'scout':return G.phase==='day'?{tile:nearestTile(t=>explorable(t))}:null;
    case 'grass':return {tile:nearestTile(t=>!t.fog&&!t.b&&t.t===0)};

    case 'ruins':return {tile:nearestTile(t=>!t.fog&&!t.b&&t.t===2)};

===================================================================== */
function makeZombie(type,x,y){
  const d=ZT[type],dm=DIFF[SET.diff||'normal'],sc=(1+(G.day-1)*.08)*dm.hp;
  return {type,x,y,hp:d.hp*sc,max:d.hp*sc,sp:d.sp*(.9+Math.random()*.2),dmg:d.dmg*(1+(G.day-1)*.04)*dm.dmg,target:null,re:0,atk:false,wob:Math.random()*6,slow:0,stun:0,flash:0,lh:null,tok:false,shirt:SHIRTS[rnd(SHIRTS.length)],ang:Math.PI/2};
}
function spawnAt(t,type,n){for(let i=0;i<n;i++)G.zs.push(makeZombie(type,t.x+.2+Math.random()*.6,t.y+.2+Math.random()*.6));}
function frontier(){let m=2;for(const t of G.tiles)if(!t.fog)m=Math.max(m,Math.max(Math.abs(t.x-C),Math.abs(t.y-C)));return m;}
function spawnEdge(type){
  const R=G.tut?5.5:Math.min(C+.4,Math.max(8,frontier()+5)),side=rnd(4),p=(Math.random()*2-1)*R;
  const pos=[[C+.5+p,C+.5-R],[C+.5+R,C+.5+p],[C+.5+p,C+.5+R],[C+.5-R,C+.5+p]][side];
  if(!type){type='walker';const r=Math.random();
    if(G.day>=6&&r<Math.min(.2,(G.day-5)*.04))type='brute';
    else if(G.day>=3&&r<Math.min(.45,.15+(G.day-3)*.06))type='runner';}
  const z=makeZombie(type,pos[0],pos[1]);G.zs.push(z);if(Math.random()<.25)SFX.groan();return z;
}
function nearestBuilding(z){let best=null,bd=1e9;for(const t of G.blds.filter(t=>t.b)){const d=dist(t.x+.5,t.y+.5,z.x,z.y);if(d<bd){bd=d;best=t;}}return best;}
function zIn(x,y,r){return G.zs.filter(z=>z.hp>0&&dist(z.x,z.y,x,y)<r);}
function hitZ(z,d,src){if(z.hp<=0)return;z.hp-=d;z.lh=src||null;z.flash=.1;if(d>=20)float(z.x,z.y-.5,Math.round(d),'#ffe08a');}
function aoe(x,y,r,d,src){for(const z of zIn(x,y,r))hitZ(z,d,src);}
function hurtB(t,d){
  const b=t.b;if(!b)return;
  if(b.shield>0)d*=.3;
  if(b.type==='wall')d*=1-Math.min(.7,G.fxv.wall||0);
  b.hp-=d;b.hit=.12;
  if(b.type==='hq'){shake(1.5);if(b.hp<b.max*.3)notify('🚨','HQ is in danger! Defend it!','bad','hqlow',15000);}
  else if(b.type!=='wall')notify('⚠️',B[b.type].name+' is under attack!','bad','atk',6000);
  if(b.hp<=0){if(b.type==='hq')hqFall();else destroy(t);}
}
function syncB(){if(G)G.blds=G.tiles.filter(t=>t.b);}
function unassign(t){const idx=t.y*N+t.x;for(const v of G.survs)if(v.job===idx)v.job=-1;autoAssign();}
function destroy(t){
  const b=t.b;t.b=null;syncB();unassign(t);splat(t.x+.5,t.y+.5,'#8a7560',18,1.4);shake(5);SFX.boom();
  G.decals.push({x:t.x+.5,y:t.y+.5,r:.45,col:'rgba(30,20,15,.6)',life:60});
  notify('💥',B[b.type].name+' was destroyed!','bad');if(G.sheetTile===t)closeSheet();
}
function hqFall(){
  const h=HQT().b;h.hp=1;G.paused=true;G.falls++;G.streak=0;SFX.boom();buzz('heavy');
  const lost={};for(const k of ['food','wood','scrap']){lost[k]=Math.floor(G[k]*.4);G[k]-=lost[k];}
  $('overSub').textContent='The horde broke in on night '+G.day;
  $('overStats').innerHTML='Survivors fled with what they could carry.<br>Lost: 🍖 '+lost.food+' · 🪵 '+lost.wood+' · ⚙️ '+lost.scrap+'<br><br>Your heroes and buildings are safe.<br>Rebuild and fight back!';
  setTimeout(()=>$('over').classList.remove('hide'),700);
}
$('againBtn').onclick=()=>{
  $('over').classList.add('hide');G.zs=[];G.spawnLeft=0;G.bossT=-1;G.fires=[];G.pend=[];
  const h=HQT().b;h.hp=h.max*.5;G.paused=false;dawn(true);save();
};

===================================================================== */
function cast(u){
  const h=HB[u.id],a=u.atk,big=h.r==='SSR';stat('skill');
  float(u.x,u.y-.9,SK[h.skill].n+'!',big?'#ffcf3a':h.r==='SR'?'#e0b8ff':'#a8d8ff',true);SFX.skill();buzz('medium');
  switch(h.skill){
    case 'bash':aoe(u.x,u.y,1.4,a*2.5,u.id);ring(u.x,u.y,1.4,'#9cc3ff');shake(2);break;
    case 'shockwave':for(const z of zIn(u.x,u.y,2.2)){hitZ(z,a*3.5,u.id);const d=dist(z.x,z.y,u.x,u.y)||1;z.x+=(z.x-u.x)/d*.8;z.y+=(z.y-u.y)/d*.8;}ring(u.x,u.y,2.2,'#ffd27a');shake(5);SFX.boom();break;
    case 'quake':for(const z of zIn(u.x,u.y,2.8)){hitZ(z,a*4.5,u.id);z.stun=2.5;}ring(u.x,u.y,2.8,'#ffcf3a');ring(u.x,u.y,1.6,'#ff9a3d');splat(u.x,u.y,'#8a7560',24,2);shake(10);SFX.boom();break;
    case 'headshot':{const z=zIn(u.x,u.y,u.range+2).sort((a,b)=>b.hp-a.hp)[0];if(z){hitZ(z,a*7,u.id);G.shots.push({x1:u.x,y1:u.y-.2,x2:z.x,y2:z.y,life:.3,w:4,col:'#ff6b5a'});splat(z.x,z.y,'#ff6b5a',10);}break;}
    case 'deathmark':for(const z of zIn(u.x,u.y,u.range+2.5).sort((a,b)=>b.hp-a.hp).slice(0,3)){hitZ(z,a*6,u.id);G.shots.push({x1:u.x,y1:u.y-.2,x2:z.x,y2:z.y,life:.35,w:4,col:'#ff3b6b'});ring(z.x,z.y,.6,'#ff3b6b');}shake(3);break;
    case 'barrage':for(const z of zIn(u.x,u.y,u.range+1).slice(0,6)){hitZ(z,a*3,u.id);G.shots.push({x1:u.x,y1:u.y-.2,x2:z.x,y2:z.y,life:.15,w:2,col:'#ffe08a'});}break;
    case 'rally':G.rally=5;for(const t of G.blds.filter(t=>t.b))if(t.b.type==='turret'||t.b.type==='mortar')ring(t.x+.5,t.y+.5,.8,'#ffe08a');break;
    case 'molotov':{const zs=zIn(u.x,u.y,u.range+1.5);let best=null,bn=-1;for(const z of zs){const n=zIn(z.x,z.y,1.2).length;if(n>bn){bn=n;best=z;}}
      if(best){G.fires.push({x:best.x,y:best.y,r:1.3,dps:a*1.6,t:4,src:u.id});ring(best.x,best.y,1.3,'#ff7a2a');}break;}
    case 'inferno':G.fires.push({x:u.x,y:u.y,r:2,dps:a*2.2,t:5,src:u.id});ring(u.x,u.y,2,'#ff5a1a');shake(3);break;
    case 'heal':for(const v of G.units)if(!v.down&&dist(v.x,v.y,u.x,u.y)<2.8){v.hp=Math.min(v.max,v.hp+v.max*.35);}
      for(const t of G.blds.filter(t=>t.b))if(dist(t.x+.5,t.y+.5,u.x,u.y)<2.8)t.b.hp=Math.min(t.b.max,t.b.hp+t.b.max*.35);ring(u.x,u.y,2.8,'#6fd16a');break;
    case 'massheal':for(const v of G.units){if(v.down){v.down=false;v.x=C+.5;v.y=C+.5;v.hp=v.max*.5;buildSquad();}else v.hp=Math.min(v.max,v.hp+v.max*.5);}
      for(const t of G.blds.filter(t=>t.b))if(dist(t.x+.5,t.y+.5,u.x,u.y)<4)t.b.hp=Math.min(t.b.max,t.b.hp+t.b.max*.4);ring(u.x,u.y,4,'#6fd16a');ring(u.x,u.y,2.5,'#c8ffb0');break;
    case 'freeze':for(const z of zIn(u.x,u.y,2.8))z.slow=4;ring(u.x,u.y,2.8,'#8ad8ff');splat(u.x,u.y,'#cdeeff',18,1.6);break;
    case 'orbital':{const zs=G.zs.filter(z=>z.hp>0);for(let i=0;i<4&&zs.length;i++){const z=zs[rnd(zs.length)];G.pend.push({t:.35+i*.25,x:z.x,y:z.y,dmg:a*5,r:1.2,src:u.id,col:'#8ad8ff',beam:1});}break;}
    case 'fortress':for(const t of G.blds.filter(t=>t.b))if(dist(t.x+.5,t.y+.5,u.x,u.y)<3)t.b.shield=6;ring(u.x,u.y,3,'#ffcf3a');break;
  }
}
function trySkill(u){
  if(u.down){toast(HB[u.id].name+' is down until dawn');return;}
  if(u.away){toast(HB[u.id].name+' is on an expedition');return;}
  if(u.scd>0){toast(SK[HB[u.id].skill].n+' ready in '+Math.ceil(u.scd)+'s');return;}
  if(!zIn(u.x,u.y,Math.max(3.5,u.range+2)).length){toast('No zombies near '+HB[u.id].name);return;}
  cast(u);u.scd=SK[HB[u.id].skill].cd;
}

===================================================================== */
function startNight(early){
  if(G.phase!=='day')return;
  G.phase='night';const boss=G.day%5===0;G.nightKills=0;
  let n=Math.max(2,Math.round((3+(G.day-1)*2+G.extraWave)*(G.weather==='fog'?1.3:1)*DIFF[SET.diff||'normal'].n));G.extraWave=0;
  if(G.tut){n=3;G.weather='clear';}
  G.spawnLeft=n;G.spawnTotal=n+(boss?1:0);G.spawnT=3;G.spawnGap=Math.max(.7,22/n);G.bossT=boss?12:-1;
  banner('NIGHT '+G.day,'#9fb4ff');SFX.night();buzz('medium');closeSheet();G.sel=null;
  stat('night_start');if(!G.seen.firstNight)setTimeout(()=>playScene('firstNight'),900);
  if(early&&G.t>5){const bonus=Math.ceil(G.t/3);give({scrap:bonus});notify('⏱️','Brave! Early start bonus: +'+bonus+' ⚙️','good');}
  refreshQuest();
}
function dawn(fell){
  const boss=G.day%5===0;
  if(!fell){stat('night');G.streak++;G.best=Math.max(G.best,G.streak);}
  const nk=G.nightKills;
  G.day++;G.phase='day';G.t=DAY;G.warned=false;G.foodWarned=false;
  const hq=HQT().b;let starving=false,mealsUsed=0,left=[];
  const hasClinic=G.blds.some(t=>t.b&&t.b.type==='clinic');
  for(const v of G.survs){
    v.hunger-=G.weather==='heat'?60:45;
    if(G.meals>=1){G.meals--;mealsUsed++;v.hunger=100;v.morale+=8;}
    else if(G.food>=2){G.food-=2;v.hunger=Math.min(100,v.hunger+70);v.morale-=2;}
    else{starving=true;v.morale-=15;}
    if(v.hunger<=0){v.hunger=0;v.health-=20;}else if(v.hunger>50)v.health+=10;
    if(hasClinic)v.health+=15;
    if(!fell)v.morale+=3;else v.morale-=15;
    if(G.weather==='cold'&&G.pr<1)v.morale-=8;
    v.health=clamp(v.health,0,100);v.morale=clamp(v.morale,0,100);
    if(v.health<=0||(v.morale<15&&Math.random()<.35))left.push(v);
  }
  for(const v of left){G.survs.splice(G.survs.indexOf(v),1);notify('🚶',v.n+(v.health<=0?' was too weak and left the camp.':' lost hope and left the camp.'),'bad');}
  G.surv=G.survs.length;autoAssign();
  if(starving){hq.hp=Math.max(1,hq.hp-15);}
  // weather roll
  const wr=Math.random();G.weather=G.day<2?'clear':wr<.45?'clear':wr<.65?'rain':wr<.8?'cold':wr<.9?'heat':'fog';
  if(G.weather!=='clear')setTimeout(()=>notify(WEATHER[G.weather].ic,WEATHER[G.weather].n+': '+WEATHER[G.weather].d,'warn'),1800);
  let room=4;for(const t of G.blds.filter(t=>t.b))if(t.b.type==='tent')room+=3*(t.b.lvl||1);
  let arrivals=0;for(const t of G.blds.filter(t=>t.b))if(t.b.type==='tent')arrivals+=t.b.lvl||1;
  const arrive=Math.max(0,Math.min(arrivals,room-G.surv));addSurv(arrive);
  hq.hp=Math.min(hq.max,hq.hp+25);G.stam=maxStam();
  const tok=fell?0:boss?3:1;G.tokens+=tok;
  for(const u of G.units){if(u.down){u.down=false;u.x=C+.5;u.y=C+.5;}u.hp=u.max;}
  buildSquad();
  banner('DAY '+G.day,'#ffd96a');SFX.day();
  if(!fell&&!G.seen.firstDawn)setTimeout(()=>playScene('firstDawn'),1500);
  if(!fell)notify('🌅','Night '+(G.day-1)+' survived! 🧟 '+nk+' killed · +'+tok+' 📻','good');
  if(!fell&&G.streak>1)notify('🔥',G.streak+' night streak!','epic');
  if(arrive)notify('⛺',arrive+' new survivor'+(arrive>1?'s':'')+' arrived!','good');
  if(starving)notify('🍖','Survivors went hungry! Collect food or cook meals.','bad');
  if(mealsUsed)notify('🍲',mealsUsed+' survivors enjoyed a hot meal. Morale up!','good');
  const sad=G.survs.filter(v=>v.morale<30).length;if(sad)notify('😟',sad+' survivors are miserable. Feed them meals!','warn');
  const idle=G.surv-workersUsed();if(idle>=2)notify('🧍',idle+' survivors have no job. Build something!','warn');
  if(heroAlert())notify('🦸','You have a free hero slot. Deploy a hero!','warn');
  save();netPush(true);
}

/* =====================================================================
   UPDATE
===================================================================== */
function update(dt){
  if(G.paused)return;
  const fx=G.fxv;
  G.blds=G.tiles.filter(t=>t.b);mapWorkers();
  const sup=powerSupply(),dem=powerDemand();G.pr=dem<=0?1:Math.min(1,sup/dem);G.pwr=[sup,dem];
  // kitchens
  for(const t of G.blds){if(t.b.type!=='kitchen')continue;const e=bEff(t);t.b.cook=(t.b.cook||0)+dt*e*lvlMul(t.b)/5;
    const cap=10+10*G.blds.filter(o=>o.b.type==='kitchen').reduce((a,o)=>a+(o.b.lvl||1),0);
    if(t.b.cook>=1){if(G.food>=3&&G.meals<cap){G.food-=3;G.meals++;t.b.cook-=1;float(t.x+.5,t.y,'+1 🍲','#ffd96a');}else t.b.cook=1;}}
  // survivors walk around
  for(const v of G.survs){
    if(v.wait>0){v.wait-=dt;continue;}
    const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);
    if(d<.05){v.wait=1+Math.random()*3;
      if(v.job>=0){const t=G.tiles[v.job];const side=rnd(4);v.tx=t.x+[.15,.85,.5,.5][side]+(Math.random()-.5)*.2;v.ty=t.y+[.6,.6,.95,.95][side]+(Math.random()-.5)*.1;}
      else{const a=Math.random()*6.28,r=.8+Math.random()*1.3;v.tx=C+.5+Math.cos(a)*r;v.ty=C+.7+Math.sin(a)*r*.7;}}
    else{const sp=.7*dt;v.x+=dx/d*Math.min(d,sp);v.y+=dy/d*Math.min(d,sp);v.ph+=dt*9;v.ang=Math.atan2(dy,dx);}
  }
  // expeditions
  for(const p of G.pois){if(p.state==='out'){p.t-=dt;if(p.t<=0)finishExp(p);}}
  G.pois=G.pois.filter(p=>!p.done);
  if(G.pois.length<3){G.poiT-=dt;if(G.poiT<=0){spawnPoi();G.poiT=20;}}
  for(const t of G.blds.filter(t=>t.b)){const b=t.b;
    if(B[b.type].prod){const k=resOf(t);b.store=Math.min(capOf(t),(b.store||0)+rateOf(t)*dt);}
    if(b.shield>0)b.shield-=dt;if(b.flash>0)b.flash-=dt;if(b.hit>0)b.hit-=dt;}
  if(fx.regen){const h=HQT().b;if(h)h.hp=Math.min(h.max,h.hp+fx.regen*dt);}
  for(const t of G.blds.filter(t=>t.b)){if(t.b.type!=='clinic')continue;const cx=t.x+.5,cy=t.y+.5,hr=lvlMul(t.b)*bEff(t);
    for(const u of G.units)if(!u.down&&dist(u.x,u.y,cx,cy)<2.4)u.hp=Math.min(u.max,u.hp+4*hr*dt);
    for(const o of G.blds.filter(t=>t.b))if(dist(o.x+.5,o.y+.5,cx,cy)<2.4)o.b.hp=Math.min(o.b.max,o.b.hp+2*hr*dt);}
  G.stamT+=dt;const sr=G.phase==='day'?3:6;if(G.stamT>=sr){G.stamT=0;if(G.stam<maxStam())G.stam++;}
  if(G.rally>0)G.rally-=dt;
  if(G.phase==='day'){if(!G.tut)G.t-=dt;if(G.t<=0)startNight(false);}
  else{
    if(G.bossT>0){G.bossT-=dt;if(G.bossT<=0){const z=spawnEdge('boss');z.tok=true;banner('☠️ THE ABOMINATION','#d48aff');notify('☠️','The Abomination has arrived!','bad');shake(6);SFX.alarm();}}
    if(G.spawnLeft>0){G.spawnT-=dt;if(G.spawnT<=0){spawnEdge();G.spawnLeft--;G.spawnT=G.spawnGap;}}
    else if(G.zs.length===0&&G.bossT<=0){dawn();}
  }
  G.alertT-=dt;if(G.alertT<=0){G.alertT=1;
    if(G.phase==='day'&&G.t<11&&!G.warned){G.warned=true;notify('🧟','The horde arrives in 10 seconds!','warn');SFX.alarm();}
    if(G.phase==='day'&&G.t<25&&!G.foodWarned&&G.food+G.meals*2<G.surv*2){G.foodWarned=true;notify('🍖','Not enough food for dawn meals! Collect from farms.','warn');}
    const full=G.stam>=maxStam();if(full&&!G.stamFull&&G.phase==='day')notify('⚡','Stamina full. Go scouting!','','stam',30000);G.stamFull=full;
    for(const t of G.blds.filter(t=>t.b))if(B[t.b.type].prod&&t.b.store>=capOf(t)&&!t.b.fullN){t.b.fullN=1;notify('📦',B[t.b.type].name+' is full! Tap it to collect.','warn','full',20000);}
    if(G.pr<1)notify('🔌','Not enough power! Upgrade or staff your Power Plant.','warn','pow',25000);
    if(G.survs.length&&G.survs.every(v=>v.job>=0)&&G.blds.some(t=>B[t.b.type].worker&&!workerOf(t)))notify('🧍','A building has no worker! Get more survivors (Tents, scouting).','warn','nowork',30000);
    refreshQuest();
    G.saveT+=1;if(G.saveT>=10){G.saveT=0;save();netPush(false);}
  }
  // structures
  for(const t of G.blds.filter(t=>t.b)){
    const b=t.b,d=B[b.type];if(!d.range)continue;
    const pw=b.type==='hq'?1:Math.max(.55,bEff(t)),lm=b.type==='hq'?1:lvlMul(b);
    b.cd-=dt*(G.rally>0&&b.type!=='hq'?2:1)*pw;const cx=t.x+.5,cy=t.y+.5,rng=d.range+(b.type==='hq'?0:((b.lvl||1)-1)*.2);let tg=null,bd=rng;
    for(const z of G.zs){if(z.hp<=0)continue;const dd=dist(z.x,z.y,cx,cy);if(dd<bd){bd=dd;tg=z;}}
    if(tg){b.ang=Math.atan2(tg.y-cy,tg.x-cx);
      if(b.cd<=0){b.cd=d.rate;
        if(b.type==='mortar'){G.pend.push({t:.6,x:tg.x,y:tg.y,dmg:d.dmg*lm*(1+(fx.turret||0)),r:1.1,src:null,col:'#ff9a3d',arc:{x:cx,y:cy}});SFX.boom();}
        else{const dmg=d.dmg*lm*(b.type==='turret'?1+(fx.turret||0):1)*(b.type==='hq'?1+.25*(b.lvl-1):1);hitZ(tg,dmg,null);SFX.shot();b.flash=.06;
          G.shots.push({x1:cx,y1:cy-.1,x2:tg.x,y2:tg.y,life:.08,w:2,col:'#ffe08a'});splat(tg.x,tg.y,'#6a8a3a',3);}}}
  }
  // heroes
  for(const u of G.units){
    if(u.down||u.away)continue;const h=HB[u.id];
    u.scd-=dt;u.cd-=dt;if(u.swing>0)u.swing-=dt;
    let tg=null;
    if(h.cls==='guard'){let bd=2.6;for(const z of G.zs){if(z.hp<=0)continue;const d=dist(z.x,z.y,u.px,u.py);if(d<bd){bd=d;tg=z;}}}
    else{let bd=u.range;for(const z of G.zs){if(z.hp<=0)continue;const d=dist(z.x,z.y,u.x,u.y);if(d<bd){bd=d;tg=z;}}}
    let gx=u.px,gy=u.py;
    if(tg&&h.cls==='guard'){const d=dist(tg.x,tg.y,u.x,u.y);if(d>u.range*.8){gx=tg.x;gy=tg.y;}else{gx=u.x;gy=u.y;}}
    const dx=gx-u.x,dy=gy-u.y,dd=Math.hypot(dx,dy);
    if(dd>.05){const s=Math.min(dd,u.sp*dt);u.x+=dx/dd*s;u.y+=dy/dd*s;u.ph+=dt*10;if(!tg)u.ang=Math.atan2(dy,dx);}
    if(tg){
      u.ang=Math.atan2(tg.y-u.y,tg.x-u.x);
      if(u.cd<=0&&dist(tg.x,tg.y,u.x,u.y)<=u.range+.05){u.cd=u.rate;hitZ(tg,u.atk,u.id);
        if(h.cls==='guard'){u.swing=.15;splat(tg.x,tg.y,'#6a8a3a',4);SFX.splat();}
        else{SFX.shot();G.shots.push({x1:u.x+Math.cos(u.ang)*.3,y1:u.y-.1+Math.sin(u.ang)*.2,x2:tg.x,y2:tg.y,life:h.cls==='marks'?.12:.06,w:h.cls==='marks'?2.5:1.5,col:h.cls==='marks'?'#bfe8ff':'#ffd27a'});}}
    }
    if(SET.autoSkill&&u.scd<=0&&zIn(u.x,u.y,Math.max(3,u.range+1.5)).length){cast(u);u.scd=SK[h.skill].cd;}
  }
  for(const p of G.pend){p.t-=dt;if(p.t<=0){aoe(p.x,p.y,p.r,p.dmg,p.src);ring(p.x,p.y,p.r,p.col);splat(p.x,p.y,p.col,14,1.5);shake(3);SFX.boom();
    G.decals.push({x:p.x,y:p.y,r:p.r*.5,col:'rgba(20,15,10,.5)',life:25});p.done=true;}}
  G.pend=G.pend.filter(p=>!p.done);
  for(const f of G.fires){f.t-=dt;for(const z of zIn(f.x,f.y,f.r))hitZ(z,f.dps*dt,f.src);if(Math.random()<.7)G.parts.push({x:f.x+(Math.random()-.5)*f.r*1.6,y:f.y+(Math.random()-.5)*f.r*1.6,vx:0,vy:-1,life:.5,col:Math.random()<.5?'#ff7a2a':'#ffd23a'});}
  G.fires=G.fires.filter(f=>f.t>0);
  // zombies
  const live=G.units.filter(u=>!u.down&&!u.away);
  for(const z of G.zs){
    if(z.hp<=0)continue;
    if(z.flash>0)z.flash-=dt;if(z.slow>0)z.slow-=dt;
    if(z.stun>0){z.stun-=dt;continue;}
    z.wob+=dt*(z.type==='runner'?9:5);z.atk=false;
    let hero=null;for(const u of live){if(dist(u.x,u.y,z.x,z.y)<ZT[z.type].r+.35){hero=u;break;}}
    if(hero){z.atk=true;z.ang=Math.atan2(hero.y-z.y,hero.x-z.x);hero.hp-=z.dmg*dt;hero.hit=.1;
      if(hero.hp<=0){hero.hp=0;hero.down=true;splat(hero.x,hero.y,'#c84a3a',14);notify('💀',HB[hero.id].name+' is down! Back at dawn.','bad');SFX.bad();buildSquad();if(G.selU===hero)G.selU=null;}continue;}
    z.re-=dt;if(z.re<=0||!z.target||!z.target.b){z.target=nearestBuilding(z);z.re=.5;}
    const t=z.target;if(!t||!t.b)continue;
    const dx=t.x+.5-z.x,dy=t.y+.5-z.y,d=Math.hypot(dx,dy);z.ang=Math.atan2(dy,dx);
    if(d>.5+ZT[z.type].r*.5){const sp=z.sp*(z.slow>0?.4:1);z.x+=dx/d*sp*dt;z.y+=dy/d*sp*dt;}
    else{z.atk=true;hurtB(t,z.dmg*dt);if(G.paused)return;}
  }
  for(let i=0;i<G.zs.length;i++)for(let j=i+1;j<G.zs.length;j++){
    const a=G.zs[i],b=G.zs[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=ZT[a.type].r+ZT[b.type].r;
    if(d>0&&d<m){const p=(m-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p;}
  }
  G.zs=G.zs.filter(z=>{
    if(z.hp>0)return true;
    G.kills++;G.nightKills++;stat('kill');SFX.splat();splat(z.x,z.y,'#4f6b2c',z.type==='boss'?40:10,z.type==='boss'?2:1);
    G.decals.push({x:z.x,y:z.y,r:ZT[z.type].r*1.2,col:'rgba(70,90,30,.55)',life:20});
    if(z.lh){const u=G.units.find(u=>u.id===z.lh);if(u)giveXp(u,ZT[z.type].xp);}
    for(const u of G.units)if(!u.down&&!u.away&&u.id!==z.lh)giveXp(u,1);
    if(z.tok){const n=z.type==='boss'?3:1;G.tokens+=n;float(z.x,z.y,'+'+n+' 📻','#ffcf3a',true);
      if(z.type==='boss'){stat('boss');banner('BOSS DOWN!','#ffcf3a');shake(10);SFX.ssr();notify('🏆','You killed the Abomination! +3 📻','epic');if(!G.seen.boss)setTimeout(()=>playScene('boss'),1500);}
      else{stat('nest');notify('👑','Nest leader killed! +1 📻','good');}}
    else if(Math.random()<.25){G.scrap+=1;float(z.x,z.y,'+1 ⚙️','#ffb535');}
    return false;
  });
  for(const s of G.shots)s.life-=dt;G.shots=G.shots.filter(s=>s.life>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);
  for(const f of G.floats){f.y-=dt*.7;f.life-=dt;}G.floats=G.floats.filter(f=>f.life>0);
  for(const r of G.rings)r.life-=dt;G.rings=G.rings.filter(r=>r.life>0);
  for(const d of G.decals)d.life-=dt;G.decals=G.decals.filter(d=>d.life>0);
  if(G.decals.length>120)G.decals.splice(0,G.decals.length-120);
  for(const t of G.tiles)if(t.rev>0)t.rev-=dt;
  for(const u of G.units)if(u.hit>0)u.hit-=dt;
}

===================================================================== */
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  ac();if(!G)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,cx:G.cam.x,cy:G.cam.y,moved:false};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:dist(a.x,a.y,b.x,b.y),z:G.cam.z};if(drag)drag.moved=true;}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!G)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];G.cam.z=clamp(pinch.z*dist(a.x,a.y,b.x,b.y)/pinch.d,32,110);clampCam();if(TUT)TUT.panned=true;return;}
  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>9)drag.moved=true;
    if(drag.moved){if(TUT&&Math.abs(dx)+Math.abs(dy)>40)TUT.panned=true;G.cam.x=drag.cx-dx/G.cam.z;G.cam.y=drag.cy-dy/G.cam.z;G.camTo=null;clampCam();}}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(drag&&!drag.moved&&ptrs.size===0){const r=cv.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top,e.clientX,e.clientY);}
  if(ptrs.size===0)drag=null;else{const p=[...ptrs.values()][0];drag={sx:p.x,sy:p.y,cx:G.cam.x,cy:G.cam.y,moved:true};}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{if(!G)return;e.preventDefault();G.cam.z=clamp(G.cam.z*(e.deltaY<0?1.1:.9),32,110);clampCam();if(TUT)TUT.panned=true;},{passive:false});

function tap(sx,sy,cx,cy){
  if(!running||G.paused)return;
  if(talkOn){nextTalk();return;}
  const [fx,fy]=s2w(sx,sy),x=Math.floor(fx),y=Math.floor(fy),t=T(x,y);
  if(!t){closeSheet();return;}
  if(G.selU){
    if(t.fog){toast('Heroes can only guard scouted tiles');return;}
    if(TUT)TUT.moved=true;
    G.selU.px=x+.5+(Math.random()-.5)*.2;G.selU.py=y+.5+(Math.random()-.5)*.2;ring(x+.5,y+.5,.5,'#fff');SFX.click();
    toast(HB[G.selU.id].name+' is moving out!');G.selU=null;buildSquad();return;
  }
  if(G.sel){placeBuilding(G.sel,t);return;}
  const hu=G.units.find(u=>!u.down&&!u.away&&dist(u.x,u.y-.25,fx,fy)<.32);
  if(hu){closeSheet();G.selU=hu;SFX.click();buildSquad();toast('Tap a tile to move '+HB[hu.id].name);return;}
  const poi=G.pois.find(p=>p.x===x&&p.y===y);if(poi){openExpedition(poi);SFX.click();return;}
  if(t.fog){closeSheet();if(explorable(t))explore(t,cx,cy);else toast('Too far! Scout tiles next to your land.');return;}
  if(t.b){
    if(B[t.b.type].prod&&(t.b.store||0)>=1&&G.sheetTile!==t){collect(t,cx,cy);return;}
    openBuildingSheet(t);SFX.click();return;
  }
  openBuildMenu(t);SFX.click();
}
function collect(t,cx,cy){
  const k=resOf(t),n=Math.floor(t.b.store);if(n<1)return;t.b.store-=n;t.b.fullN=0;
  const r={};r[k]=n;give(r,[cx,cy]);float(t.x+.5,t.y,'+'+n+' '+RES_ICON[k],'#fff',true);stat('collect');buzz('light');
  // collect neighbours of same type too for convenience
  for(const o of G.blds.filter(t=>t.b)){if(o!==t&&B[o.b.type].prod&&(o.b.store||0)>=Math.max(1,capOf(o)*.5)&&dist(o.x,o.y,t.x,t.y)<=2.5){const kk=resOf(o),m=Math.floor(o.b.store);o.b.store-=m;o.b.fullN=0;const rr2={};rr2[kk]=m;give(rr2);float(o.x+.5,o.y,'+'+m+' '+RES_ICON[kk],'#fff',true);}}
  refreshQuest();
}
function explore(t,cx,cy){
  if(G.phase==='night'){toast('Too dangerous to scout at night 🌙');SFX.bad();return;}
  const c=scoutCost();if(G.stam<c){toast('Out of ⚡ stamina. It recharges over time.');SFX.bad();return;}
  G.stam-=c;stat('scout');t.fog=false;t.rev=.6;const x=t.x+.5,y=t.y+.5,f=t.f;t.f=null;SFX.scout();buzz('light');
  splat(x,y,'#cfc8b8',10,1);
  if(f==='nest'){const n=1+Math.floor(G.day/3);spawnAt(t,'walker',n);const l=makeZombie(G.day>=5?'brute':'walker',x,y);if(G.day<5){l.hp*=2.5;l.max*=2.5;}l.tok=true;G.zs.push(l);notify('🧟','Zombie nest! Kill the 👑 leader for a 📻 code.','bad');shake(3);SFX.alarm();if(!G.seen.nest)setTimeout(()=>playScene('nest'),500);}
  else if(f==='event'){openEvent(t);}
  else if(f==='crate'){const a=rr(8,14),b=rr(8,14);give({food:a,wood:b},[cx,cy]);float(x,y,'SUPPLY CRATE!','#ffd96a',true);}
  else if(f==='wreck'){const n=rr(8,14);give({scrap:n},[cx,cy]);float(x,y,'WRECKED CAR!','#ffd96a',true);}
  else if(f==='surv'){addSurv(1,true);float(x,y,'+1 🧍 '+G.survs[G.survs.length-1].n,'#6fd16a',true);notify('🧍','You found a survivor!','good');}
  else if(f==='radio'){G.tokens+=2;float(x,y,'+2 📻','#ffcf3a',true);notify('📻','Radio tower! +2 recruit codes','good');SFX.claim();}
  else{const r=Math.random();
    if(r<.3){const n=rr(3,7);give({food:n},[cx,cy]);}
    else if(r<.6){const n=rr(3,7);give({wood:n},[cx,cy]);}
    else if(r<.75){const n=rr(2,4);give({scrap:n},[cx,cy]);}
    else float(x,y,'empty...','#c4ab92');}
  refreshQuest();
}
function placeBuilding(k,t){
  const why=canPlace(k,t);
  if(why){toast(B[k].name+': '+why);SFX.bad();return false;}
  const d=B[k];pay(d.cost);t.b={type:k,hp:d.hp,max:d.hp,cd:0,ang:-1.2,shield:0,lvl:1,store:0};syncB();autoAssign();stat('b_'+k);
  splat(t.x+.5,t.y+.5,'#ffb535',14);ring(t.x+.5,t.y+.5,.7,'#ffb535');SFX.build();buzz('light');float(t.x+.5,t.y,d.name+'!','#ffd96a',true);
  G.sel=null;closeSheet();refreshQuest();if(k==='gen'&&!G.seen.gen)setTimeout(()=>playScene('gen'),700);return true;
}

function closeSheet(){$('sheet').classList.remove('show');if(G){G.sheetTile=null;G.sheetPoi=null;}}
function openBuildMenu(t){
  G.sheetTile=t;const tn=['Grass','Forest','Ruins'][t.t];
  let h='<div class="shh"><div class="tt"><b>Build on '+tn+'</b><span>Free survivors: '+(G.surv-workersUsed())+' 🧍 · tap a building</span></div><button class="x" id="shX">✕</button></div><div class="opts">';
  const list=BUILD_ORDER.filter(k=>B[k].on.includes(t.t));

    h+='<div class="opt '+(lock?'lock':why?'no':'')+'" data-k="'+k+'"><img src="'+IMG['b_'+k]+'" alt=""><b>'+d.name+'</b><span>'+(lock?'🔒 HQ Lv '+d.hq:costStr(d.cost)+(d.worker?' 🧍':''))+'</span></div>';}

    if(hqLvl()<B[k].hq){toast('Upgrade HQ to Lv '+B[k].hq+' to unlock '+B[k].name);return;}
    if(!placeBuilding(k,t))toast(B[k].desc);});
}
function openBuildingSheet(t){
  G.sheetTile=t;const b=t.b,d=B[b.type],lvl=b.lvl||1;
  let info='';
  if(b.type==='hq'){info='Level <b>'+lvl+'</b> · Hero slots <b>'+HQSLOTS[lvl]+'</b> · Buildings can reach Lv <b>'+lvl+'</b>';}
  else if(d.prod){const k=resOf(t);info='Makes <b>'+(rateOf(t)*60).toFixed(k==='tokens'?1:0)+' '+RES_ICON[k]+'/min</b> · Storage <b>'+Math.floor(b.store||0)+'/'+capOf(t)+'</b>'+(powered(t)?' · <b style="color:#ffe05a">⚡ Powered</b>':'');}
  else if(d.range){info='Damage <b>'+Math.round(d.dmg*lvlMul(b))+'</b> · Range <b>'+(d.range+(lvl-1)*.2).toFixed(1)+'</b>'+(powered(t)?' · <b style="color:#ffe05a">⚡ Powered</b>':'');}
  else info=d.desc;
  if(b.type==='gen'){const pw=G.pwr||[powerSupply(),powerDemand()];info='Base power: <b>'+pw[0]+' 🔌</b> · Using: <b>'+pw[1]+' 🔌</b>'+(pw[1]>pw[0]?' · <b style="color:#ff8a7a">BROWNOUT! Upgrade me.</b>':'')+'<br>Upgrades add +8 🔌. A happy worker runs it at full power.';}
  else if(b.type==='kitchen')info='Turns <b>3 🍖 → 1 🍲</b> about every '+Math.round(5/Math.max(.1,bEff(t)*lvlMul(b)))+'s · Meals stored: <b>'+G.meals+'</b>';
  if(d.worker){const w=workerOf(t);info+='<br>👷 Worker: <b>'+(w?w.n+' ('+Math.round(eff(w)*100)+'% efficiency)':'NONE! Building is idle')+'</b>';}
  if(PUSE[b.type])info+=' · 🔌 '+PUSE[b.type]+(G.pr<1?' <b style="color:#ff8a7a">(low power '+Math.round(G.pr*100)+'%)</b>':'');
  let h='<div class="shh"><img src="'+IMG['b_'+b.type]+'" alt=""><div class="tt"><b>'+d.name+' <span style="display:inline;color:var(--acc);font-family:var(--font);font-size:15px">Lv '+lvl+'</span></b><span>❤️ '+Math.ceil(b.hp)+'/'+b.max+'</span></div><button class="x" id="shX">✕</button></div>';
  h+='<div class="stline">'+info+'</div><div class="acts">';
  if(d.prod&&(b.store||0)>=1)h+='<button class="btn green" id="aCol">Collect<small>+'+Math.floor(b.store)+' '+RES_ICON[resOf(t)]+'</small></button>';
  if(b.type==='hq'){const c=HQUP[lvl];h+=c?'<button class="btn" id="aUp" '+(afford(c)?'':'disabled')+'>Upgrade HQ<small>'+costStr(c)+'</small></button>':'<button class="btn" disabled>MAX LEVEL</button>';}
  else{const c=upCost(t),cap=lvl>=5?'MAX':lvl>=hqLvl()?'Needs HQ Lv '+(lvl+1):null;
    h+=cap?'<button class="btn" disabled>Upgrade<small>'+cap+'</small></button>':'<button class="btn" id="aUp" '+(afford(c)?'':'disabled')+'>Upgrade<small>'+costStr(c)+'</small></button>';}
  const rc=Math.ceil((b.max-b.hp)/8);if(rc>0)h+='<button class="btn blue" id="aRep">Repair<small>🪵'+rc+'</small></button>';
  if(b.type!=='hq')h+='<button class="btn gray" id="aDem" style="flex:0 0 auto;min-width:0">🗑️</button>';
  h+='</div>';
  $('sheetIn').innerHTML=h;$('sheet').classList.add('show');$('shX').onclick=closeSheet;
  const r=cv.getBoundingClientRect();
  if($('aCol'))$('aCol').onclick=()=>{const [sx,sy]=w2s(t.x+.5,t.y+.5);collect(t,r.left+sx,r.top+sy);openBuildingSheet(t);};
  if($('aUp'))$('aUp').onclick=()=>upgrade(t);

const NET={ok:false,db:null,uid:null,nick:'',aid:null,tab:'rank',chat:[],gifts:[],seenChat:0,lastPush:0,lastRaid:0,lastGift:0,chatUnsub:null,ally:{},raidSel:[],writeOk:true};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function myDef(){let d=hqLvl()*60+G.survs.length*3;for(const t of G.blds||[]){if(!t.b)continue;const l=t.b.lvl||1;if(t.b.type==='turret')d+=40*l;else if(t.b.type==='mortar')d+=70*l;else if(t.b.type==='wall')d+=15*l;}
  for(const u of G.units)if(!u.down&&!u.away)d+=heroPow(u.id);return Math.round(d);}
function myScore(){return (G.stats.night||0)*100+(G.stats.kill||0)+Object.keys(G.owned).length*50+hqLvl()*200+(G.stats.raidwin||0)*150;}
async function netInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    NET.db=db;NET.uid=uid;
    const me=await db.doc('players/'+uid).get();
    if(me.exists){const d=me.data();NET.nick=d.nick||'';NET.aid=d.aid||null;}
    NET.ok=true;netSubs();if(NET.nick)netPush(true);
  }catch(e){console.warn('online off',e);}
}
async function netPush(force){
  if(G&&G.tut)return;
  if(!NET.ok||!NET.nick||!G||!running)return;const now=Date.now();if(!force&&now-NET.lastPush<30000)return;NET.lastPush=now;
  const loot={};for(const k of ['food','wood','scrap'])loot[k]=Math.min(300,Math.floor(G[k]*.25));
  try{await NET.db.doc('players/'+NET.uid).set({nick:NET.nick,aid:NET.aid||null,score:myScore(),nights:G.stats.night||0,kills:G.stats.kill||0,best:G.best,heroes:Object.keys(G.owned).length,hq:hqLvl(),def:myDef(),loot,day:G.day,raidwins:G.stats.raidwin||0,ts:now});NET.writeOk=true;}
  catch(e){if(e&&e.code==='invalid_argument')NET.writeOk=false;}
}
function netSubs(){
  const db=NET.db;
  db.collection('raids/'+NET.uid+'/log').orderBy('ts','desc').limit(20).onSnapshot(snap=>{
    for(const d of snap.docs){const r=d.data();if(!r||r.applied)continue;
      if(r.win){const lost={};for(const k in (r.stolen||{})){const v=Math.min(Math.floor(G[k]||0),Math.max(0,Math.floor(r.stolen[k]||0)));G[k]-=v;lost[k]=v;}
        notify('⚔️',(r.nick||'Someone')+' raided your base! Lost '+Object.entries(lost).map(([k,v])=>RES_ICON[k]+v).join(' '),'bad');shake(4);}
      else notify('🛡️','Your base held off a raid from '+(r.nick||'someone')+'!','good');
      NET.db.doc('raids/'+NET.uid+'/log/'+d.id).update({applied:true}).catch(()=>{});}
  },()=>{});
  db.collection('gifts/'+NET.uid+'/inbox').onSnapshot(snap=>{
    const before=NET.gifts.length;NET.gifts=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(NET.gifts.length>before&&!snap.metadata.fromCache)notify('🎁','You received a gift! Open 🌐 to claim it.','good','gift',5000);
    netBadge();if(G&&G.netOpen&&NET.tab==='gifts')renderOnline();
  },()=>{});

}

  if(NET.chatUnsub){NET.chatUnsub();NET.chatUnsub=null;}NET.chat=[];

    const newest=snap.docs[0]?snap.docs[0].data():null;NET.chat=snap.docs.map(d=>d.data());

    if(G&&G.netOpen&&NET.tab==='ally'){NET.seenChat=newest?newest.ts:0;renderOnline();}netBadge();
  },()=>{});
}

function ryonicCanSync(){ try { return !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()); } catch(e){ return false; } }
function ryonicLink(stats){
  var json = JSON.stringify(stats);
  var b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  var s = 'ryonic|' + b64, h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return 'ryonic://sync?d=' + b64 + '&c=' + h.toString(16);
}
function ryonicSend(stats){
  var link = ryonicLink(stats);
  if (typeof window.__ryonicOpen === 'function') window.__ryonicOpen(link); else window.location.href = link;
}
/* when this game runs as an iPhone app, share its progress live with the Ryonic app (App Group) */
function ryonicShare(getStats){

  if (!P) return;

  setTimeout(put, 2000); setInterval(put, 5000);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) put(); });
  window.addEventListener('pagehide', put);
}

function speakerInfo(who){

  if(!talkQ.length){endTalk();return;}

  if(it.cb){try{it.cb();}catch(e){console.error('cb',e);}showTalk();return;}
  if(!it.chap&&(!it.who||typeof it.txt!=='string')){showTalk();return;}

}

    lx.globalCompositeOperation='source-over';lx.clearRect(0,0,VW,VH);lx.fillStyle='rgba(8,10,34,'+dark+')';lx.fillRect(0,0,VW,VH);
    lx.globalCompositeOperation='destination-out';
    const light=(x,y,r,a)=>{const [sx,sy]=w2s(x,y),rr0=r*z,g=lx.createRadialGradient(sx,sy,0,sx,sy,rr0);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.beginPath();lx.arc(sx,sy,rr0,0,6.283);lx.fill();};
    light(C+.5,C+.5,2.6,.9);
    for(const t of (G.blds||[]).filter(t=>t.b))if(t.b.type!=='hq')light(t.x+.5,t.y+.5,['turret','mortar','clinic','radio','gen'].includes(t.b.type)?1.5:.9,.6);
    for(const u of G.units)if(!u.down&&!u.away)light(u.x,u.y,1.3,.7);
    for(const f of G.fires)light(f.x,f.y,f.r+.9,1);
    for(const r of G.rings)light(r.x,r.y,r.r,.6*r.life/r.max);
    for(const s of G.shots)light(s.x1,s.y1,.6,.5);
    ctx.drawImage(lc,0,0,VW,VH);
    // zombie eyes glow over darkness
    ctx.fillStyle='#ff2a1a';for(const zz of G.zs){const [sx,sy]=w2s(zz.x,zz.y),s=z*(zz.type==='boss'?.62:zz.type==='brute'?.44:zz.type==='runner'?.3:.34),hy=sy-s*.58,ax=Math.cos(zz.ang||0)*s*.06;
      ctx.globalAlpha=.85;circ(ctx,sx-s*.12+ax,hy+s*.02,s*.06);circ(ctx,sx+s*.12+ax,hy+s*.02,s*.06);}ctx.globalAlpha=1;
  }
  // weather
  if(G.weather==='rain'){ctx.strokeStyle='rgba(170,200,255,.35)';ctx.lineWidth=1.2;for(let i=0;i<70;i++){const x=(hash(i,1,1)*VW+now*60*(1+hash(i,2,2)))%VW,y=(hash(i,3,3)*VH+now*500*(.8+hash(i,4,4)*.4))%VH;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+14);ctx.stroke();}}
  if(G.weather==='cold'){ctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<60;i++){const x=(hash(i,1,5)*VW+Math.sin(now+i)*20)%VW,y=(hash(i,3,6)*VH+now*40*(.6+hash(i,4,7)))%VH;circ(ctx,x,y,1.5+hash(i,5,5)*1.5);}ctx.fillStyle='rgba(150,190,255,.08)';ctx.fillRect(0,0,VW,VH);}
  if(G.weather==='heat'){ctx.fillStyle='rgba(255,140,40,.09)';ctx.fillRect(0,0,VW,VH);}
  if(G.weather==='fog'){const g=ctx.createRadialGradient(VW/2,VH/2,VW*.2,VW/2,VH/2,VW*.9);g.addColorStop(0,'rgba(200,200,210,0)');g.addColorStop(1,'rgba(200,200,210,.45)');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);}
  // expedition markers
  for(const p of G.pois){const [sx,sy]=w2s(p.x+.5,p.y+.5);if(sx<-60||sy<-60||sx>VW+60||sy>VH+60)continue;
    const r=z*.36,bob=p.state==='out'?0:Math.sin(now*3+p.x)*z*.05,cy2=sy+bob;
    ctx.fillStyle='rgba(0,0,0,.4)';ell(ctx,sx,sy+r*1.1,r*.8,r*.25);
    ctx.fillStyle=p.kind==='camp'?'#7a1f1f':'#2f5a2a';ctx.strokeStyle=p.kind==='camp'?'#ff6b5a':'#9be07a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,cy2,r,0,6.283);ctx.fill();ctx.stroke();
    ctx.font=(r*1.1)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.kind==='camp'?'🏕️':'📦',sx,cy2+1);
    ctx.font=Math.max(11,r*.55)+'px Lilita One,system-ui';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.fillStyle='#ffd96a';ctx.strokeText('Lv'+p.lvl,sx,cy2+r*1.25);ctx.fillText('Lv'+p.lvl,sx,cy2+r*1.25);
    if(p.state==='out'){const k=1-p.t/p.dur;ctx.strokeStyle='#6fd16a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx,cy2,r+5,-Math.PI/2,-Math.PI/2+k*6.283);ctx.stroke();
      ctx.font=Math.max(11,r*.5)+'px Lilita One,system-ui';ctx.strokeText('🎒 '+Math.ceil(p.t)+'s',sx,cy2-r*1.35);ctx.fillStyle='#fff';ctx.fillText('🎒 '+Math.ceil(p.t)+'s',sx,cy2-r*1.35);}}
  // fx on top
  for(const f of G.fires){for(let i=0;i<4;i++){const a=now*3+i*1.6,[sx,sy]=w2s(f.x+Math.cos(a)*f.r*.5,f.y+Math.sin(a*1.3)*f.r*.5);ctx.fillStyle='rgba(255,'+(110+i*35)+',40,.75)';
    ctx.beginPath();ctx.moveTo(sx-z*.1,sy);ctx.quadraticCurveTo(sx,sy-z*.35,sx+z*.1,sy);ctx.fill();}}
  for(const p of G.parts){const [sx,sy]=w2s(p.x,p.y);ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.col;ctx.fillRect(sx-2.5,sy-2.5,5,5);}ctx.globalAlpha=1;
  ctx.lineCap='round';
  for(const s of G.shots){const [a,b]=w2s(s.x1,s.y1),[c2,d2]=w2s(s.x2,s.y2);ctx.strokeStyle=s.col;ctx.lineWidth=s.w||2;ctx.globalAlpha=Math.min(1,s.life*10);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c2,d2);ctx.stroke();
    ctx.fillStyle='#fff6c0';circ(ctx,a,b,(s.w||2)*1.6);}
  ctx.globalAlpha=1;ctx.lineWidth=1;ctx.lineCap='butt';
  for(const p of G.pend){const [sx,sy]=w2s(p.x,p.y);ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.globalAlpha=.5+.5*Math.sin(now*20);ctx.beginPath();ctx.arc(sx,sy,Math.max(1,p.r*z*(1-p.t)),0,6.283);ctx.stroke();
    if(p.beam){ctx.fillStyle='rgba(140,220,255,'+(.3+.3*(1-p.t))+')';ctx.fillRect(sx-z*.08,0,z*.16,sy);}
    if(p.arc){const [ax2,ay2]=w2s(p.arc.x,p.arc.y),k=1-p.t/.6,mx=ax2+(sx-ax2)*k,my=ay2+(sy-ay2)*k-Math.sin(k*Math.PI)*z*1.5;ctx.fillStyle='#222';circ(ctx,mx,my,z*.07);}}
  ctx.globalAlpha=1;
  for(const r of G.rings){const k=1-r.life/r.max,[sx,sy]=w2s(r.x,r.y);ctx.strokeStyle=r.col;ctx.globalAlpha=1-k;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(sx,sy,r.r*z*(.3+.7*k),r.r*z*(.3+.7*k)*.75,0,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;ctx.lineWidth=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of G.floats){const [sx,sy]=w2s(f.x,f.y);ctx.globalAlpha=Math.min(1,f.life*1.5);ctx.font=Math.max(13,z*(f.big?.36:.28))+'px Lilita One,system-ui';
    ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(f.txt,sx,sy);ctx.fillStyle=f.col;ctx.fillText(f.txt,sx,sy);}
  ctx.globalAlpha=1;ctx.restore();
}
function drawBOver(t,sx,sy,z,now){
  const b=t.b,d=B[b.type];
  if(b.shield>0){ctx.strokeStyle='rgba(255,207,58,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx+z/2,sy+z/2,z*.55,0,6.283);ctx.stroke();}
  if(B[b.type].worker&&!workerOf(t)){ctx.font=(z*.24)+'px serif';ctx.textAlign='center';ctx.fillText('🚫🧍',sx+z*.5,sy+z*.25);}
  else if(PUSE[b.type]&&G.pr<1&&Math.sin(now*6)>0){ctx.font=(z*.24)+'px serif';ctx.textAlign='center';ctx.fillText('🔌',sx+z*.85,sy+z*.85);}
  if((b.lvl||1)>1&&b.type!=='hq'){ctx.fillStyle='#ffcf3a';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font=(z*.24)+'px Lilita One,system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.strokeText(b.lvl,sx+z*.06,sy+z*.84);ctx.fillText(b.lvl,sx+z*.06,sy+z*.84);}
  if(b.type==='hq'){ctx.fillStyle='#ffcf3a';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font=(z*.26)+'px Lilita One,system-ui';ctx.textAlign='center';ctx.strokeText('Lv'+b.lvl,sx+z*.5,sy+z*.98);ctx.fillText('Lv'+b.lvl,sx+z*.5,sy+z*.98);}
  if(b.hp<b.max||b.type==='hq'){const w=z*.7,f=Math.max(0,b.hp/b.max),bx=sx+z*.15,by=sy-z*(b.type==='hq'?.42:.12);
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx,by,w,6);ctx.fillStyle=f>.5?'#6fd16a':f>.25?'#ffb535':'#ef4b3a';ctx.fillRect(bx+1,by+1,(w-2)*f,4);}
  if(d.prod&&(b.store||0)>=Math.max(1,capOf(t)*.2)){
    const full=b.store>=capOf(t),bob=Math.sin(now*4+t.x)*z*.05,bx=sx+z*.5,by=sy-z*.2+bob,r=z*.24;
    if(full){ctx.fillStyle='rgba(255,207,58,.45)';circ(ctx,bx,by,r*1.4);}
    ctx.fillStyle='#fff';ctx.strokeStyle='#120d0a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(bx,by,r,0,6.283);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-r*.3,by+r*.85);ctx.lineTo(bx,by+r*1.3);ctx.lineTo(bx+r*.3,by+r*.85);ctx.fill();
    ctx.font=(r*1.15)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(RES_ICON[resOf(t)],bx,by+1);
  }
}

/* start-screen art */
function drawStartArt(){
  const c=$('startArt').getContext('2d'),W2=600,H2=430;
  const g=c.createLinearGradient(0,0,0,H2);g.addColorStop(0,'#2a1a3a');g.addColorStop(.6,'#8a3a2a');g.addColorStop(1,'#1a120c');c.fillStyle=g;c.fillRect(0,0,W2,H2);
  c.fillStyle='#ffd27a';circ(c,450,140,60);c.fillStyle='rgba(255,210,122,.25)';circ(c,450,140,95);
  c.fillStyle='#1a1220';for(let i=0;i<9;i++){const bx=i*70-10,bh=90+hash(i,1,1)*120;c.fillRect(bx,250-bh,58,bh+40);c.fillStyle='#2a1e2a';for(let j=0;j<4;j++)if(hash(i,j,2)>.6)c.fillRect(bx+10+(j%2)*24,260-bh+20+Math.floor(j/2)*30,12,14);c.fillStyle='#1a1220';}
  c.fillStyle='#2a3a1e';c.fillRect(0,300,W2,130);
  const zs=[[90,330,.9],[170,352,1.1],[520,340,1],[440,360,1.2],[40,370,1]];
  for(const [x,y,s] of zs)drawZombie(c,x,y,34*s,{type:'walker',ang:Math.PI/2*(x<300?0:2),wob:x,shirt:SHIRTS[x%SHIRTS.length],flash:0,slow:0},0);
  drawHero(c,250,360,46,HB.viktor,0,0,false);drawHero(c,340,370,46,HB.nova,Math.PI,0,false);drawHero(c,300,330,40,HB.dara,-Math.PI/2,0,false);
}

/* =====================================================================
   LOOP / LIFECYCLE
===================================================================== */
let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  requestAnimationFrame(loop);
  try{
    if(running&&G){update(dt*G.speed);if(G.shake>0)G.shake=Math.max(0,G.shake-dt*20);G.uiT-=dt;if(G.uiT<=0){G.uiT=.12;G.uiN=(G.uiN||0)+1;refreshTop();}}
  }catch(e){console.error('update',e);syncB();}
  try{if(G){syncB();draw();}}catch(e){console.error('draw',e);try{ctx.restore();}catch(_){}}
  try{tutTick();updHand();}catch(e){}
}
/* =====================================================================
   BOOT CAMP — playable tutorial (sandbox: never touches the real save)
===================================================================== */
let TUT=null,TUT_AUTO=false;
const TSTEPS=[
  {t:'Welcome to Boot Camp, Commander! First, drag the map with your finger to look around. You can pinch to zoom too.',chk:()=>TUT.panned},
  {t:'See the glowing ? tiles at the edge of your land? Tap one to send scouts. Scouting costs ⚡ stamina.',chk:()=>(G.stats.scout||0)>=1,
    setup:()=>{const t=nearestTile(t=>explorable(t));if(t)t.f='crate';},tgt:()=>G.phase==='day'?{tile:nearestTile(t=>explorable(t)&&t.f==='crate')||nearestTile(t=>explorable(t))}:null},
  {t:'Supplies! Now tap an empty GRASS tile and build a 🌾 Farm. Farms grow food.',chk:()=>countType('farm')>=1,
    setup:()=>{G.wood=Math.max(G.wood,20);},tgt:()=>optOr('farm',t=>!t.fog&&!t.b&&t.t===0)},
  {t:'A survivor is working your farm. Tap the farm when the 🍖 bubble pops up to collect the food!',chk:()=>(G.stats.collect||0)>=1,
    setup:()=>{const f=G.tiles.find(t=>t.b&&t.b.type==='farm');if(f)f.b.store=Math.max(f.b.store||0,15);},tgt:()=>{const f=G.tiles.find(t=>t.b&&t.b.type==='farm');return f?{tile:f}:null;}},
  {t:'Heroes defend your camp. Tap 📻 Recruit and use your radio code to recruit a hero!',chk:()=>G.pulls>=1&&$('mod').classList.contains('hide'),
    setup:()=>{G.tokens=Math.max(G.tokens,1);},tgt:()=>$('mod').classList.contains('hide')?(G.pulls>=1?null:{q:'#recBtn'}):(G.pulls<1?{q:'#p1'}:{q:'#modX'})},
  {t:'Nice recruit! Tap a hero standing on the map, then tap a tile to send them there.',chk:()=>TUT.moved,
    tgt:()=>{if(G.selU){return {tile:nearestTile(t=>!t.fog&&!t.b&&dist(t.x,t.y,C,C)>=2)};}const u=G.units.find(u=>!u.down);return u?{w:[u.x,u.y-.2]}:null;}},
  {t:'Zombies attack at night! Tap an empty tile and build a 🔫 Turret to shoot them.',chk:()=>countType('turret')>=1,
    setup:()=>{G.wood=Math.max(G.wood,15);G.scrap=Math.max(G.scrap,15);},tgt:()=>optOr('turret',t=>!t.fog&&!t.b)},
  {t:'Ready? Tap ⚔️ START NIGHT to call in the horde. (In the real game, night also comes on its own.)',chk:()=>G.phase==='night',tgt:()=>({q:'#nightBtn'})},
  {t:'Here they come! When zombies get close, tap a GLOWING hero portrait at the bottom to fire their special skill! ⚡',chk:()=>(G.stats.skill||0)>=1||G.phase==='day',
    setup:()=>{for(const u of G.units)u.scd=0;},tgt:()=>{const u=G.units.find(u=>!u.down&&u.scd<=0&&zIn(u.x,u.y,Math.max(3.5,u.range+2)).length);return u?{q:'#port_'+u.id}:null;}},
  {t:'Hold the line! Your HQ, turrets and heroes fight on their own. Clear every zombie to see the sunrise.',chk:()=>G.phase==='day'&&G.day>=2},
  {t:'You survived your first night! 🎉 You know the basics: scout, build, collect, recruit and defend. The quest bar will guide you from here.',fin:true}
];
function optOr(k,pred){const e=document.querySelector('.opt[data-k="'+k+'"]');if(e&&e.offsetParent&&$('sheet').classList.contains('show'))return {q:'.opt[data-k="'+k+'"]'};const t=nearestTile(pred);return t?{tile:t}:null;}
function tutTarget(){if(!TUT||TUT.i>=TSTEPS.length)return null;const st=TSTEPS[TUT.i];if(!st.tgt)return null;if(talkOn)return null;try{return st.tgt();}catch(e){return null;}}
function startTutorial(from){
  if(from==='menu')save();
  TUT={i:0,from,panned:false,moved:false};TUT_AUTO=!!SET.autoSkill;SET.autoSkill=false;
  talkQ=[];if(talkOn)endTalk();closeSheet();
  $('start').classList.add('hide');$('over').classList.add('hide');$('mod').classList.add('hide');
  G=baseState();G.tut=true;G.tiles=genMap();G.surv=0;addSurv(4,true);
  for(const t of G.tiles){if(t.f)t.f=null;}
  G.seen={intro:1,firstNight:1,firstDawn:1,nest:1,ch2:1,gen:1,ch3:1,boss:1,ch4:1,ch5:1};G.introDone=true;G.lastDaily=todayStr();
  G.food=40;G.wood=40;G.scrap=20;G.tokens=0;G.poiT=1e9;G.weather='clear';G.t=DAY;
  recalcFx();deploy('bolt');afterLoad();syncB();resize();clampCam();refreshTop();buildSquad();
  running=true;G.paused=false;$('quest').hidden=true;$('tut').hidden=false;$('tutImg').src=IMG.ada;
  tutShow();SFX.day();
}
function tutShow(){
  const st=TSTEPS[TUT.i];if(st.setup)try{st.setup();}catch(e){}
  $('tutN').textContent='BOOT CAMP · '+(TUT.i+1)+'/'+TSTEPS.length;$('tutT').textContent=st.t;
  const done=TUT.from==='menu'&&hasSave()?'Back to my base':'Start the real game';
  $('tutBtns').innerHTML=st.fin?'<button class="go" id="tutGo">'+done+'</button>':'<button class="sk" id="tutSkip">End<br>training</button>';
  if(st.fin){$('tutGo').onclick=()=>endTutorial(true);banner('TRAINING COMPLETE','#ffcf3a');SFX.ssr();}
  else $('tutSkip').onclick=()=>{SFX.click();endTutorial(false);};
}
function tutTick(){
  if(!TUT||!running)return;const st=TSTEPS[TUT.i];if(st.fin||!st.chk)return;
  let ok=false;try{ok=st.chk();}catch(e){}
  if(ok){TUT.i++;SFX.claim();buzz('light');tutShow();}
}
function endTutorial(finished){
  const from=TUT?TUT.from:'first';TUT=null;SET.autoSkill=TUT_AUTO;SET.tutDone=true;saveSet();
  $('tut').hidden=true;$('quest').hidden=false;$('hand').style.display='none';
  talkQ=[];if(talkOn)endTalk();closeSheet();$('mod').classList.add('hide');$('over').classList.add('hide');
  G.zs=[];
  let loaded=false;if(from==='menu')loaded=load();
  if(!loaded){newGame();if(finished)G.tokens+=2;}
  G.blds=G.tiles.filter(t=>t.b);G.paused=false;clampCam();refreshTop();buildSquad();refreshQuest();running=true;
  if(!loaded){
    if(finished)setTimeout(()=>notify('🎓','Boot Camp complete! Bonus: +2 📻 recruit codes','epic'),400);
    playScene('intro',false,()=>{G.introDone=true;save();setTimeout(()=>{notify('📻','You have '+Math.floor(G.tokens)+' recruit codes. Tap Recruit to get heroes!','epic');checkDaily();setTimeout(pushOffer,6000);},700);});
  }else toast('Welcome back to your base!');
}
function go(fresh){
  ac();setTimeout(pushOffer,15000);setTimeout(netInit,1500);
  $('start').classList.add('hide');$('over').classList.add('hide');$('mod').classList.add('hide');
  resize();
  let loaded=false;if(!fresh)loaded=load();
  if(!loaded&&!SET.tutDone){running=true;startTutorial('first');return;}
  if(!loaded)newGame();
  G.blds=G.tiles.filter(t=>t.b);clampCam();refreshTop();running=true;SFX.day();
  if(!G.seen.intro){playScene('intro',false,()=>{G.introDone=true;save();setTimeout(()=>{notify('📻','You have 3 recruit codes. Tap Recruit to get heroes!','epic');checkDaily();},700);});}
  else if(G.welcome)setTimeout(()=>welcomeBack(G.welcome),300);
  else setTimeout(checkDaily,400);
}
function startScreen(){
  const s=hasSave();
  $('startBtns').innerHTML=s?'<button class="big" id="bCont">CONTINUE</button><br><button class="big alt" id="bNew">New game</button>':'<button class="big" id="bPlay">PLAY</button>';
  if(s){$('bCont').onclick=()=>go(false);
    $('bNew').onclick=()=>{$('startBtns').innerHTML='<p style="text-align:center">Start over? Your saved base will be deleted.</p><button class="big alt" id="bBack">Back</button> <button class="big" id="bYes">Start over</button>';
      $('bBack').onclick=startScreen;$('bYes').onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}go(true);};};}
  else $('bPlay').onclick=()=>go(true);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();schedulePush();}else{cancelPush();setTimeout(schedulePush,30000);}});
setInterval(()=>{if(running&&!document.hidden)schedulePush();},30000);
window.addEventListener('pagehide',save);
resize();bakeArt();drawStartArt();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bakeArt();drawStartArt();});
G=baseState();G.tiles=genMap();G.blds=G.tiles.filter(t=>t.b);startScreen();requestAnimationFrame(loop);
</script>
